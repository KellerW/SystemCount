name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (yajl, glib)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libyajl-dev \
            libglib2.0-dev \
            cmake \
            build-essential

      - name: Build Debug
        run: |
          ./build.sh Debug

      - name: Build Release
        run: |
          ./build.sh Release

      - name: Run simple test
        run: |
          echo '{"items":[{"model":"A"},{"model":"B"},{"model":"A"}]}' > test.json
          ./build/App -i test.json > out.txt
          cat out.txt
